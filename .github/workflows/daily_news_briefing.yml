name: Daily Real Estate News Briefing

on:
  schedule:
    - cron: '30 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-and-summarize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai feedparser pydantic

      - name: Run news collection & Gemini analysis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/fetch_news_briefing.py

      - name: Commit and push updated JSON
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/news_briefing.json
          if git diff --staged --quiet; then
            echo "변경된 뉴스 데이터가 없어 커밋을 건너뜁니다."
          else
            git commit -m "chore: update daily real estate news briefing ($(TZ=Asia/Seoul date +'%Y-%m-%d'))"
            git push
          fi
